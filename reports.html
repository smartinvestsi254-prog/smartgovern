<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGovern Reports</title>
    <style>
      :root { --bg:#07111f; --panel:#101c2f; --text:#f8fafc; --muted:#93a3b8; --accent:#5eead4; }
      body { margin:0; font-family:Inter,Segoe UI,sans-serif; background:linear-gradient(135deg,#07111f,#14233f); color:var(--text); }
      .layout { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
      .sidebar { background:#0b1525; padding:24px; border-right:1px solid rgba(255,255,255,.08); }
      .nav a { display:block; color:#cbd5e1; text-decoration:none; padding:10px 12px; border-radius:10px; margin:6px 0; }
      .nav a.active, .nav a:hover { background:rgba(94,234,212,.12); color:white; }
      .main { padding:28px; }
      .card { background:rgba(16,28,47,.95); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:18px; margin-bottom:16px; }
      .muted { color:var(--muted); }
      .metric { font-size:1.5rem; font-weight:700; color:var(--accent); }
      @media (max-width: 900px) { .layout { grid-template-columns:1fr; } .sidebar { border-right:none; border-bottom:1px solid rgba(255,255,255,.08); } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>SmartGovern</h2>
        <p>Executive reporting</p>
        <div class="nav">
          <a href="dashboard.html">Overview</a>
          <a href="compliance.html">Compliance</a>
          <a href="risk.html">Risk</a>
          <a class="active" href="reports.html">Reports</a>
          <a href="pricing.html">Pricing</a>
        </div>
      </aside>
      <main class="main">
        <div class="card">
          <h1>Board-ready reporting</h1>
          <p class="muted">Generate monthly summaries for investor relations, operations, and compliance committees.</p>
        </div>
        <div class="card">
          <div class="metric">92% on-time submissions</div>
          <p class="muted">Automated sharing and export-ready documentation.</p>
        </div>
      </main>
    </div>
  </body>
</html>
