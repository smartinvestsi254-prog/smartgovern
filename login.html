<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGovern Login</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { display:grid; place-items:center; min-height:100vh; }
      .auth-card { width:min(460px, 92vw); padding:28px; border-radius:24px; background:rgba(23,23,23,.95); border:1px solid var(--border); box-shadow:0 18px 45px rgba(0,0,0,.25); }
      .field { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
      input { padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#121212; color:var(--text); }
      .actions { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <span class="pill">Secure access</span>
      <h1 style="margin:8px 0;">Welcome back</h1>
      <p class="muted">Sign in to your SmartGovern workspace.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="ops@company.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <div class="actions">
        <a href="dashboard.html" class="btn btn-primary">Sign in</a>
        <a href="signup.html" class="muted">Create account</a>
      </div>
    </div>
  </body>
</html>
