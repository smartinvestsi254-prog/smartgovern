<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGovern Signup</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { display:grid; place-items:center; min-height:100vh; }
      .auth-card { width:min(520px, 92vw); padding:28px; border-radius:24px; background:rgba(23,23,23,.95); border:1px solid var(--border); box-shadow:0 18px 45px rgba(0,0,0,.25); }
      .field { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
      input, select { padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:#121212; color:var(--text); }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <span class="pill">Start your workspace</span>
      <h1 style="margin:8px 0;">Create your SmartGovern account</h1>
      <p class="muted">Launch governance, risk, and reporting for your finance team.</p>
      <div class="field">
        <label>Full name</label>
        <input type="text" placeholder="Alicia Morgan" />
      </div>
      <div class="field">
        <label>Company</label>
        <input type="text" placeholder="Northstar Capital" />
      </div>
      <div class="field">
        <label>Plan</label>
        <select>
          <option>Starter</option>
          <option>Growth</option>
          <option>Enterprise</option>
        </select>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@company.com" />
      </div>
      <div style="margin-top:16px;">
        <a href="dashboard.html" class="btn btn-primary">Create account</a>
      </div>
    </div>
  </body>
</html>
